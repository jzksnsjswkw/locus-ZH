name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project Locus.xcodeproj \
            -scheme Locus \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build | tee build/xcodebuild.log
      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$PWD/build/DerivedData/Build/Products/Release-iphoneos/Locus.app"
          test -d "$APP"
          mkdir -p build/Payload
          ditto "$APP" build/Payload/Locus.app
          cd build
          /usr/bin/zip -qry Locus-unsigned.ipa Payload
          /usr/bin/unzip -t Locus-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Locus-unsigned
          path: |
            build/Locus-unsigned.ipa
            build/xcodebuild.log
          if-no-files-found: error


